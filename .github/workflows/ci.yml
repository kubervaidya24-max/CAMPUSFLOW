name: CampusFlow CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'level-*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Code Quality & Linting
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run ESLint across All Workspaces
        run: npm run lint

  # 2. Backend Integration, Unit, E2E & Security Tests
  test-server:
    name: Backend Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Server Tests (Unit, Integration, E2E, Security)
        run: npm run test:server
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_32_characters_long_min
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_32_characters
          COOKIE_SECRET: ci_test_cookie_secret_key

  # 3. Frontend Component & Smoke Tests
  test-client:
    name: Frontend Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Client Component Tests
        run: npm run test:client

  # 4. Production Client Build Validation
  build-client:
    name: Client Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Optimized Production Bundle
        run: npm run build
