# ==============================================================================
# CampusFlow — Local Full-Stack Development Orchestration
# ==============================================================================
services:
  # 1. MongoDB Database Engine
  mongo:
    image: mongo:7.0-jammy
    container_name: campusflow-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - campusflow-net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend REST API & Socket.IO Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campusflow-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/campusflow
      - CORS_ORIGIN=http://localhost
      - JWT_SECRET=campusflow_production_jwt_access_secret_2026_key_very_long
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=campusflow_production_jwt_refresh_secret_2026_key_very_long
      - JWT_REFRESH_EXPIRES_IN=7d
      - COOKIE_SECRET=campusflow_production_cookie_secret_2026_key
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - campusflow-net

  # 3. Frontend Web Application (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: campusflow-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - campusflow-net

volumes:
  mongo-data:
    driver: local

networks:
  campusflow-net:
    driver: bridge
